<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightreign Random Picker</title>
  <!-- SEO -->
  <meta name="description" content="Random character picker for ELDEN RING NIGHTREIGN. Randomly select Nightfarers for your party.">
  <meta name="keywords" content="ELDEN RING, NIGHTREIGN, random picker, character select, Nightfarer">
  <meta name="author" content="myurait">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#080a0f">
  <link rel="canonical" href="https://myurait.github.io/nightreign-random-picker/">
  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico">
  <!-- OGP -->
  <meta property="og:title" content="Nightreign Random Picker">
  <meta property="og:description" content="Random character picker for ELDEN RING NIGHTREIGN. Randomly select Nightfarers for your party.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://myurait.github.io/nightreign-random-picker/">
  <meta property="og:image" content="https://myurait.github.io/nightreign-random-picker/images/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Nightreign Random Picker">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nightreign Random Picker">
  <meta name="twitter:description" content="Random character picker for ELDEN RING NIGHTREIGN. Randomly select Nightfarers for your party.">
  <meta name="twitter:image" content="https://myurait.github.io/nightreign-random-picker/images/ogp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-fixed"></div>
  <div class="bg-overlay"></div>

  <div class="main-container">

    <div class="page-title">
      <h1>Nightreign Random Picker</h1>
      <div class="subtitle">Nightfarer Select</div>
      <hr class="title-hr">
    </div>

    <div class="card-grid">

      <!-- Slot 1 -->
      <div class="character-card is-unselected">
        <div class="card-inner">
          <div class="card-portrait">
            <img src="images/unselected.png" alt="Unselected">
          </div>
          <div class="card-separator"></div>
          <div class="card-info">
            <h2 class="character-name">Unselected</h2>
          </div>
          <button class="reload-btn" aria-label="Reroll">
            <img src="images/reload.png" alt="reload">
          </button>
        </div>
      </div>

      <!-- Slot 2 -->
      <div class="character-card is-unselected">
        <div class="card-inner">
          <div class="card-portrait">
            <img src="images/unselected.png" alt="Unselected">
          </div>
          <div class="card-separator"></div>
          <div class="card-info">
            <h2 class="character-name">Unselected</h2>
          </div>
          <button class="reload-btn" aria-label="Reroll">
            <img src="images/reload.png" alt="reload">
          </button>
        </div>
      </div>

      <!-- Slot 3 -->
      <div class="character-card is-unselected">
        <div class="card-inner">
          <div class="card-portrait">
            <img src="images/unselected.png" alt="Unselected">
          </div>
          <div class="card-separator"></div>
          <div class="card-info">
            <h2 class="character-name">Unselected</h2>
          </div>
          <button class="reload-btn" aria-label="Reroll">
            <img src="images/reload.png" alt="reload">
          </button>
        </div>
      </div>

    </div><!-- .card-grid -->

    <div class="controls-wrap">
      <button class="randomize-all-btn" aria-label="Randomize All">
        Randomize All
      </button>
      <label class="dlc-toggle">
        <input type="checkbox" id="dlc-toggle-input" checked>
        <span class="dlc-toggle-slider"></span>
        <span class="dlc-toggle-label">The Forsaken Hollows</span>
      </label>
    </div>

  </div><!-- .main-container -->

  <script src="js/main.js"></script>

</body>
</html>
